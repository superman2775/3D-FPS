<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS - Single File</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        #game-canvas { display: block; width: 100%; height: 100%; }
        
        /* UI Layers */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.8); color: white; z-index: 10; user-select: none; }
        #start-menu { display: flex; }
        #game-over-menu { display: none; }
        
        h1 { font-size: 48px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; color: #ff3333; text-shadow: 2px 2px 0px #000; }
        p { font-size: 18px; margin-bottom: 30px; text-align: center; line-height: 1.5; color: #ccc; }
        .btn { padding: 15px 40px; font-size: 24px; font-weight: bold; background: #ff3333; color: white; border: none; cursor: pointer; border-radius: 5px; font-family: inherit; transition: background 0.2s; }
        .btn:hover { background: #ff6666; }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 5; user-select: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); }
        #crosshair::before { content: ''; position: absolute; top: 9px; left: 0; width: 20px; height: 2px; background: rgba(255, 255, 255, 0.8); }
        #crosshair::after { content: ''; position: absolute; top: 0; left: 9px; width: 2px; height: 20px; background: rgba(255, 255, 255, 0.8); }
        
        .hud-panel { position: absolute; bottom: 20px; padding: 15px; background: rgba(0,0,0,0.5); border: 2px solid #333; border-radius: 5px; color: white; font-size: 20px; font-weight: bold; }
        #health-panel { left: 20px; border-color: #aa0000; }
        #ammo-panel { right: 20px; border-color: #00aa00; }
        #score-panel { top: 20px; left: 20px; bottom: auto; border-color: #aaaa00; }
        
        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 4; }
        
        .bar-container { width: 150px; height: 15px; background: #333; margin-top: 5px; outline: 1px solid #000; }
        #hp-bar { height: 100%; background: #ff3333; width: 100%; transition: width 0.2s; }
    </style>
</head>
<body>

    <!-- UI Overlays -->
    <div id="start-menu" class="overlay">
        <h1>Sector Clear</h1>
        <p>WASD to Move | Mouse to Look<br>Left Click to Shoot</p>
        <button class="btn" id="start-btn">CLICK TO PLAY</button>
    </div>

    <div id="game-over-menu" class="overlay">
        <h1>YOU DIED</h1>
        <p id="final-score">Score: 0</p>
        <button class="btn" id="restart-btn">RESPAWN</button>
    </div>

    <!-- Gameplay HUD -->
    <div id="hud">
        <div id="crosshair"></div>
        <div id="score-panel">KILLS: <span id="score-val">0</span></div>
        <div id="health-panel">
            HP: <span id="hp-val">100</span>
            <div class="bar-container"><div id="hp-bar"></div></div>
        </div>
        <div id="ammo-panel">AMMO: <span id="ammo-val">10</span> / 10</div>
    </div>
    <div id="damage-flash"></div>

    <!-- Module Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Main Game Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- Game State Variables ---
        let camera, scene, renderer, controls;
        let pVelocity = new THREE.Vector3();
        let pDirection = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        let prevTime = performance.now();
        let gameActive = false;
        
        // Player Stats
        const MAX_HP = 100;
        let playerHP = MAX_HP;
        let score = 0;
        let lastDamageTime = 0;

        // Weapon Stats
        const MAX_AMMO = 10;
        let ammo = MAX_AMMO;
        let canShoot = true;
        let isReloading = false;
        
        // Entities
        const obstacles = [];
        const obstacleBoxes = []; // For collision
        let enemies = [];
        let particles = [];
        
        // Weapon Visuals
        let gunMesh, muzzleFlash;

        // Configuration
        const MAP_SIZE = 100;
        const P_SPEED = 40.0;
        const ENEMY_BASE_SPEED = 8.0;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.025);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2; // Player eye level

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft white light
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xaabbff, 1.5);
            dirLight.position.set(-20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            scene.add(dirLight);

            // 5. Environment Generation
            buildWorld();

            // 6. Player Weapon Setup
            buildWeapon();

            // 7. Controls & Input
            controls = new PointerLockControls(camera, document.body);
            setupEventHandlers();

            // 8. Initial Enemies
            for(let i=0; i<3; i++) spawnEnemy();
            
            // Resize handler
            window.addEventListener('resize', onWindowResize);
        }

        function buildWorld() {
            // Floor
            const geoFloor = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
            const matFloor = new THREE.MeshStandardMaterial({ 
                color: 0x1a2a1a, 
                roughness: 0.8,
            });
            const floor = new THREE.Mesh(geoFloor, matFloor);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Obstacles
            const obstacleGeo = new THREE.BoxGeometry(1, 1, 1);
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
            
            for (let i = 0; i < 20; i++) {
                const box = new THREE.Mesh(obstacleGeo, obstacleMat);
                
                // Random scale
                const w = Math.random() * 4 + 2;
                const h = Math.random() * 8 + 3;
                const d = Math.random() * 4 + 2;
                box.scale.set(w, h, d);

                // Random position (avoid center where player spawns)
                let px, pz;
                do {
                    px = (Math.random() - 0.5) * (MAP_SIZE - 10);
                    pz = (Math.random() - 0.5) * (MAP_SIZE - 10);
                } while (Math.abs(px) < 10 && Math.abs(pz) < 10);

                box.position.set(px, h / 2, pz);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
                obstacles.push(box);

                // Create collision box
                const bbox = new THREE.Box3().setFromObject(box);
                obstacleBoxes.push(bbox);
            }

            // Boundary Walls
            const wallMat = new THREE.MeshStandardMaterial({color: 0x111111});
            const thickness = 2;
            const height = 10;
            const walls = [
                {x: 0, z: -MAP_SIZE/2, w: MAP_SIZE, d: thickness}, // North
                {x: 0, z: MAP_SIZE/2, w: MAP_SIZE, d: thickness},  // South
                {x: -MAP_SIZE/2, z: 0, w: thickness, d: MAP_SIZE}, // West
                {x: MAP_SIZE/2, z: 0, w: thickness, d: MAP_SIZE}   // East
            ];

            walls.forEach(w => {
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, height, w.d), wallMat);
                wallMesh.position.set(w.x, height/2, w.z);
                scene.add(wallMesh);
                obstacleBoxes.push(new THREE.Box3().setFromObject(wallMesh));
            });
        }

        function buildWeapon() {
            // Gun Body
            const gunGroup = new THREE.Group();
            
            const barrelGeo = new THREE.BoxGeometry(0.1, 0.1, 0.6);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.position.set(0, 0, -0.2);
            gunGroup.add(barrel);

            const gripGeo = new THREE.BoxGeometry(0.1, 0.25, 0.15);
            const grip = new THREE.Mesh(gripGeo, barrelMat);
            grip.position.set(0, -0.15, 0);
            grip.rotation.x = Math.PI / 8;
            gunGroup.add(grip);

            // Muzzle Flash Light
            muzzleFlash = new THREE.PointLight(0xffaa00, 0, 10);
            muzzleFlash.position.set(0, 0, -0.6);
            gunGroup.add(muzzleFlash);

            // Position relative to camera (bottom right)
            gunGroup.position.set(0.3, -0.3, -0.5);
            camera.add(gunGroup);
            scene.add(camera);
            gunMesh = gunGroup;
        }

        // --- Enemy Class & Logic ---
        class Enemy {
            constructor() {
                this.hp = 3;
                this.maxHp = 3;
                this.speed = ENEMY_BASE_SPEED + (Math.random() * 4); // Vary speed
                
                // Mesh
                const geo = new THREE.BoxGeometry(1.5, 2.5, 1.5);
                this.material = new THREE.MeshStandardMaterial({ color: 0xff3300 });
                this.mesh = new THREE.Mesh(geo, this.material);
                
                // Spawn position (away from player)
                let px, pz;
                do {
                    px = (Math.random() - 0.5) * MAP_SIZE * 0.8;
                    pz = (Math.random() - 0.5) * MAP_SIZE * 0.8;
                } while (new THREE.Vector2(px, pz).distanceTo(new THREE.Vector2(camera.position.x, camera.position.z)) < 20);
                
                this.mesh.position.set(px, 1.25, pz);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                
                // Attach reference to object for raycaster
                this.mesh.userData.enemy = this; 

                // Canvas Health Bar
                this.canvas = document.createElement('canvas');
                this.canvas.width = 128;
                this.canvas.height = 32;
                this.ctx = this.canvas.getContext('2d');
                this.texture = new THREE.CanvasTexture(this.canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: this.texture, depthTest: false });
                this.hpSprite = new THREE.Sprite(spriteMat);
                this.hpSprite.position.y = 2.0;
                this.hpSprite.scale.set(1.5, 0.375, 1);
                this.mesh.add(this.hpSprite);
                
                this.updateHealthBar();
                scene.add(this.mesh);
            }

            updateHealthBar() {
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, 128, 32);
                this.ctx.fillStyle = '#ff0000';
                this.ctx.fillRect(2, 2, 124, 28);
                this.ctx.fillStyle = '#00ff00';
                this.ctx.fillRect(2, 2, 124 * (this.hp / this.maxHp), 28);
                this.texture.needsUpdate = true;
            }

            takeDamage() {
                this.hp--;
                this.updateHealthBar();
                
                // Flash white
                this.material.color.setHex(0xffffff);
                setTimeout(() => {
                    if (this.material) this.material.color.setHex(0xff3300);
                }, 100);

                if (this.hp <= 0) {
                    this.die();
                }
            }

            die() {
                // Particles
                createExplosion(this.mesh.position, 0xff3300);
                
                // Cleanup
                scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.material.dispose();
                this.texture.dispose();
                
                // Remove from array
                const index = enemies.indexOf(this);
                if (index > -1) enemies.splice(index, 1);
                
                // Update Score
                score++;
                document.getElementById('score-val').innerText = score;

                // Keep population up
                setTimeout(spawnEnemy, 1000);
            }

            update(delta) {
                // Find vector to player
                const playerPos = camera.position.clone();
                playerPos.y = this.mesh.position.y; // Keep movement on horizontal plane
                
                const distance = this.mesh.position.distanceTo(playerPos);
                
                // Attack logic
                if (distance < 2.5) {
                    const now = performance.now();
                    if (now - lastDamageTime > 1000) { // 1 sec cooldown on enemy attack
                        damagePlayer(20);
                        lastDamageTime = now;
                    }
                } else {
                    // Move towards player
                    this.mesh.lookAt(playerPos);
                    const direction = new THREE.Vector3(0,0,1).applyQuaternion(this.mesh.quaternion);
                    this.mesh.position.add(direction.multiplyScalar(this.speed * delta));
                }
            }
        }

        function spawnEnemy() {
            if (!gameActive) return;
            enemies.push(new Enemy());
        }

        // --- Particle System ---
        function createExplosion(position, colorHex) {
            const particleCount = 20;
            const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            
            for (let i = 0; i < particleCount; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);
                
                // Random velocity outward
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 15,
                    (Math.random() - 0.2) * 15,
                    (Math.random() - 0.5) * 15
                );
                
                particles.push({
                    mesh: mesh,
                    velocity: velocity,
                    life: 1.0 // 1 second lifespan
                });
                scene.add(mesh);
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    p.velocity.y -= 20 * delta; // Gravity
                    p.mesh.position.add(p.velocity.clone().multiplyScalar(delta));
                    p.mesh.rotation.x += p.velocity.x * delta;
                    p.mesh.rotation.y += p.velocity.y * delta;
                    p.mesh.scale.setScalar(p.life); // Shrink over time
                }
            }
        }

        // --- Shooting Mechanics ---
        function shoot() {
            if (!gameActive || !canShoot || isReloading) return;
            
            if (ammo <= 0) {
                reload();
                return;
            }

            // Shoot logic
            canShoot = false;
            ammo--;
            updateHUD();

            // Muzzle Flash Animation
            muzzleFlash.intensity = 20;
            gunMesh.position.z -= 0.1; // Recoil
            gunMesh.rotation.x += 0.1;
            
            setTimeout(() => { 
                muzzleFlash.intensity = 0; 
                gunMesh.position.z += 0.1; // Return
                gunMesh.rotation.x -= 0.1;
            }, 50);

            setTimeout(() => { canShoot = true; }, 250); // Fire rate cooldown

            if (ammo <= 0) {
                setTimeout(reload, 300);
            }

            // Raycaster for hit detection
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Collect all hittable objects (enemies + obstacles)
            const hittables = enemies.map(e => e.mesh).concat(obstacles);
            const intersects = raycaster.intersectObjects(hittables, false);

            if (intersects.length > 0) {
                const hitObj = intersects[0].object;
                if (hitObj.userData.enemy) {
                    hitObj.userData.enemy.takeDamage();
                } else {
                    // Hit wall, spawn spark
                    createExplosion(intersects[0].point, 0xaaaaaa);
                }
            }
        }

        function reload() {
            if (isReloading || ammo === MAX_AMMO) return;
            isReloading = true;
            document.getElementById('ammo-val').innerText = "RLD";
            document.getElementById('ammo-val').style.color = "yellow";
            
            // Gun reload animation (dip down)
            gunMesh.rotation.x = -Math.PI / 4;
            
            setTimeout(() => {
                ammo = MAX_AMMO;
                isReloading = false;
                gunMesh.rotation.x = 0;
                document.getElementById('ammo-val').style.color = "white";
                updateHUD();
            }, 1200); // 1.2s reload time
        }

        // --- Player Logic ---
        function damagePlayer(amt) {
            playerHP -= amt;
            if (playerHP < 0) playerHP = 0;
            updateHUD();

            // Visual feedback
            const flash = document.getElementById('damage-flash');
            flash.style.opacity = '0.5';
            setTimeout(() => { flash.style.opacity = '0'; }, 200);

            if (playerHP <= 0) {
                gameOver();
            }
        }

        function checkCollision(position) {
            // Player AABB
            const playerRadius = 0.5;
            const playerBox = new THREE.Box3(
                new THREE.Vector3(position.x - playerRadius, 0, position.z - playerRadius),
                new THREE.Vector3(position.x + playerRadius, 2, position.z + playerRadius)
            );

            for (let i = 0; i < obstacleBoxes.length; i++) {
                if (playerBox.intersectsBox(obstacleBoxes[i])) {
                    return true;
                }
            }
            return false;
        }

        // --- State Management & Input ---
        function setupEventHandlers() {
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');

            startBtn.addEventListener('click', () => controls.lock());
            restartBtn.addEventListener('click', () => {
                resetGame();
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                document.getElementById('start-menu').style.display = 'none';
                document.getElementById('game-over-menu').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                gameActive = true;
                prevTime = performance.now();
            });

            controls.addEventListener('unlock', () => {
                if (playerHP > 0) {
                    // Paused
                    document.getElementById('start-menu').style.display = 'flex';
                    document.getElementById('start-btn').innerText = "RESUME (CLICK IN WINDOW)";
                }
                document.getElementById('hud').style.display = 'none';
                gameActive = false;
            });

            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'KeyR': reload(); break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });

            document.addEventListener('mousedown', (e) => {
                if(e.button === 0 && gameActive) shoot();
            });
        }

        function updateHUD() {
            document.getElementById('hp-val').innerText = playerHP;
            document.getElementById('hp-bar').style.width = (playerHP / MAX_HP * 100) + '%';
            if (!isReloading) document.getElementById('ammo-val').innerText = ammo;
        }

        function gameOver() {
            controls.unlock();
            gameActive = false;
            document.getElementById('hud').style.display = 'none';
            document.getElementById('game-over-menu').style.display = 'flex';
            document.getElementById('final-score').innerText = `Final Kills: ${score}`;
        }

        function resetGame() {
            // Clear enemies
            enemies.forEach(e => {
                scene.remove(e.mesh);
                e.material.dispose();
                e.texture.dispose();
            });
            enemies = [];

            // Reset player stats
            playerHP = MAX_HP;
            score = 0;
            ammo = MAX_AMMO;
            updateHUD();
            document.getElementById('score-val').innerText = score;

            // Reset Camera
            camera.position.set(0, 2, 0);
            
            // Spawn initial enemies
            for(let i=0; i<3; i++) spawnEnemy();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // 1. Player Movement Update
                pVelocity.x -= pVelocity.x * 10.0 * delta; // Friction
                pVelocity.z -= pVelocity.z * 10.0 * delta;

                pDirection.z = Number(moveForward) - Number(moveBackward);
                pDirection.x = Number(moveRight) - Number(moveLeft);
                pDirection.normalize(); // Ensure consistent speed all directions

                if (moveForward || moveBackward) pVelocity.z -= pDirection.z * P_SPEED * delta;
                if (moveLeft || moveRight) pVelocity.x -= pDirection.x * P_SPEED * delta;

                // Proposed new position
                controls.moveRight(-pVelocity.x * delta);
                let currentPos = camera.position.clone();
                
                // X Collision Check
                if (checkCollision(currentPos)) {
                    controls.moveRight(pVelocity.x * delta); // Undo move
                    pVelocity.x = 0;
                }

                controls.moveForward(-pVelocity.z * delta);
                currentPos = camera.position.clone();

                // Z Collision Check
                if (checkCollision(currentPos)) {
                    controls.moveForward(pVelocity.z * delta); // Undo move
                    pVelocity.z = 0;
                }
                
                // Lock Y axis to prevent flying/sinking
                camera.position.y = 2;

                // Gun bobbing animation
                if ((moveForward || moveBackward || moveLeft || moveRight) && !isReloading) {
                    gunMesh.position.y = -0.3 + Math.sin(time * 0.01) * 0.02;
                    gunMesh.position.x = 0.3 + Math.cos(time * 0.005) * 0.01;
                } else {
                    gunMesh.position.y = -0.3;
                    gunMesh.position.x = 0.3;
                }

                // 2. Enemy AI Update
                enemies.forEach(enemy => enemy.update(delta));
                
                // Ensure min enemies
                if(enemies.length < 3 && Math.random() < 0.01) spawnEnemy();

                // 3. Particles
                updateParticles(delta);

                prevTime = time;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
